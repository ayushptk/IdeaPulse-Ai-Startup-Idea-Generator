[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "UP", "B", "S", "BLE", "G", "PIE", "RUF", "SIM", "TRY", "I"]
ignore = [
    "B008",    # FastAPI Depends() is evaluated at runtime
    "S101",    # Use of assert is expected in tests
    "G004",    # f-strings in logging are fine for many projects
    "BLE001",  # blind exceptions are sometimes needed
    "TRY",     # tryceratops rules can be too noisy
    "S314",    # standard library XML parsing is fine for this project
    "PIE790",  # Unnecessary pass is fine
    "E501",    # Line too long
    "S311",    # Standard pseudo-random generators
    "S105",    # Possible hardcoded password
    "G201",    # Logging .exception instead of error
    "S110",    # try-except-pass
    "RUF001",  # ambiguous unicode
    "RUF002",  # ambiguous unicode
    "SIM102",  # nested ifs
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
